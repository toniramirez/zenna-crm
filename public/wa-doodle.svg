<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    Muro de garabatos de la conversación, al estilo del fondo de WhatsApp.
    El referente sirve un .webp propio; este SVG es equivalente y nuestro,
    así no dependemos de un asset de terceros. Se pinta desde
    `.wa-conv-bg::before` con opacidad muy baja, por eso los trazos van en
    negro plano: el color final lo pone esa opacidad sobre el papel crema.

    OJO: nada de dos guiones seguidos acá adentro. XML no los permite en un
    comentario y el SVG entero deja de parsear (el fondo sale liso, sin aviso).
  -->
  <g fill="none" stroke="#0b141a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- corazón -->
    <path d="M34 40c-6-7-16-5-16 3 0 8 10 14 16 19 6-5 16-11 16-19 0-8-10-10-16-3z" transform="rotate(-12 34 50)"/>
    <!-- tijera -->
    <g transform="translate(120 26) rotate(18)">
      <circle cx="3" cy="30" r="5"/>
      <circle cx="21" cy="30" r="5"/>
      <path d="M6 26 24 2M18 26 0 2"/>
    </g>
    <!-- burbuja de chat -->
    <path d="M212 24h34a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6h-20l-11 9v-9h-3a6 6 0 0 1-6-6V30a6 6 0 0 1 6-6z"/>
    <!-- chispa -->
    <path d="M316 30v18M307 39h18M334 52v10M329 57h10"/>
    <!-- espiral / bucle de pelo -->
    <path d="M366 24c-10 0-16 7-16 14s5 12 11 12 9-4 9-8-3-6-6-6-4 2-4 4"/>
    <!-- taza -->
    <g transform="translate(28 108)">
      <path d="M0 8h28v18a10 10 0 0 1-10 10H10A10 10 0 0 1 0 26z"/>
      <path d="M28 12h5a6 6 0 0 1 0 12h-5"/>
      <path d="M8 0c0 3 3 3 3 6M17 0c0 3 3 3 3 6"/>
    </g>
    <!-- estrella -->
    <path d="M106 110l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z"/>
    <!-- reloj -->
    <g transform="translate(190 106)">
      <circle cx="18" cy="18" r="17"/>
      <path d="M18 8v11l7 5"/>
    </g>
    <!-- gota -->
    <path d="M290 104c8 10 14 16 14 23a14 14 0 0 1-28 0c0-7 6-13 14-23z"/>
    <!-- peine -->
    <g transform="translate(346 110) rotate(-14)">
      <path d="M0 0h34v9H0z"/>
      <path d="M4 9v14M11 9v18M18 9v14M25 9v18M32 9v14"/>
    </g>
    <!-- cámara -->
    <g transform="translate(20 192)">
      <path d="M0 8h9l4-6h14l4 6h9a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z"/>
      <circle cx="22" cy="23" r="9"/>
    </g>
    <!-- nota musical -->
    <g transform="translate(112 186)">
      <path d="M8 34V4l20-4v30"/>
      <circle cx="3" cy="35" r="6"/>
      <circle cx="23" cy="31" r="6"/>
    </g>
    <!-- carita -->
    <g transform="translate(186 190)">
      <circle cx="18" cy="18" r="17"/>
      <path d="M11 14v3M25 14v3M10 24c3 5 13 5 16 0"/>
    </g>
    <!-- sobre -->
    <g transform="translate(276 196) rotate(8)">
      <path d="M0 0h38v26H0z"/>
      <path d="M0 0l19 14L38 0"/>
    </g>
    <!-- anillo -->
    <g transform="translate(352 192)">
      <circle cx="16" cy="24" r="13"/>
      <path d="M9 12l7-9 7 9z"/>
    </g>
    <!-- sol -->
    <g transform="translate(34 282)">
      <circle cx="16" cy="16" r="9"/>
      <path d="M16 0v5M16 27v5M0 16h5M27 16h5M4.7 4.7l3.5 3.5M23.8 23.8l3.5 3.5M27.3 4.7l-3.5 3.5M8.2 23.8l-3.5 3.5"/>
    </g>
    <!-- regalo -->
    <g transform="translate(114 284)">
      <path d="M0 10h34v24H0zM17 10v24M0 18h34"/>
      <path d="M17 10C13 10 8 8 8 4s7-3 9 6c2-9 9-8 9-4s-5 4-9 4z"/>
    </g>
    <!-- teléfono -->
    <g transform="translate(196 280) rotate(-10)">
      <path d="M4 2h16a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z"/>
      <path d="M9 6h6"/>
    </g>
    <!-- secador -->
    <g transform="translate(272 288) rotate(14)">
      <path d="M0 6h22a10 10 0 0 1 0 20H0z"/>
      <path d="M0 6v20M8 26l4 12"/>
    </g>
    <!-- flor -->
    <g transform="translate(348 286)">
      <circle cx="16" cy="14" r="5"/>
      <path d="M16 9c0-7-9-7-9 0M16 9c0-7 9-7 9 0M11 14c-6 3-2 11 4 7M21 14c6 3 2 11-4 7M16 21v13"/>
    </g>
    <!-- pulgar / ok -->
    <g transform="translate(40 356)">
      <path d="M0 12h7v20H0zM7 14l7-12c4 0 6 3 5 7l-2 5h9a4 4 0 0 1 4 5l-3 12a5 5 0 0 1-5 4H7z"/>
    </g>
    <!-- chispa chica -->
    <path d="M150 358v14M143 365h14"/>
    <!-- doble tilde -->
    <path d="M214 366l6 7 12-14M226 366l6 7 12-14"/>
    <!-- espejo de mano -->
    <g transform="translate(300 352)">
      <circle cx="14" cy="14" r="13"/>
      <path d="M14 27v14"/>
    </g>
    <!-- ondas -->
    <path d="M348 366c5-6 10 6 15 0s10 6 15 0"/>
  </g>
</svg>
